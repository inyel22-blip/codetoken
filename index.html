<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dasbor ATEI V2.2.0</title>
    <style>
        body { font-family: sans-serif; background-color: #f1f5f9; padding: 15px; margin: 0; }
        .container { max-width: 600px; margin: 0 auto; background: #ffffff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h2 { color: #1e3a8a; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; font-size: 18px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-weight: bold; margin-bottom: 4px; font-size: 13px; color: #475569; }
        input[type="text"] { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-family: monospace; font-size: 13px; background-color: #f8fafc; }
        button { background-color: #2563eb; color: white; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 15px; font-weight: bold; width: 100%; margin-top: 10px; }
        .output-box { margin-top: 15px; background-color: #0f172a; color: #38bdf8; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 12px; white-space: pre-wrap; word-break: break-all; max-height: 200px; overflow-y: auto; }
        .badge { display: inline-block; padding: 5px 10px; border-radius: 6px; font-weight: bold; margin-top: 12px; font-size: 13px; color: white; }
        .success { background-color: #10b981; } .error { background-color: #ef4444; }
    </style>
</head>
<body>
<div class="container">
    <h2>🛠️ Dasbor ATEI BARTIM (Bypass V2.2.0)</h2>
    <div class="form-group">
        <label>URL Endpoint:</label>
        <input type="text" id="apiUrl" value="https://api-absen.baritotimurkab.go.id/public/api">
    </div>
    <div class="form-group">
        <label>Authorization Token:</label>
        <input type="text" id="apiToken" value="419618|NOOuuJTcJKmV2dv6omw69OXA5goCnW8H6aJuOKpjb06f986c">
    </div>
    <div class="form-group">
        <label>x-device-id:</label>
        <input type="text" id="deviceId" value="79c04db7067d7d2f">
    </div>
    <div class="form-group">
        <label>x-install-id:</label>
        <input type="text" id="installId" value="9a1f07d0438a56dc871f65d10fe655b31c71b213a14eca12">
    </div>
    <button onclick="ambilTokenQR()">🔄 Ambil QR Server (Auto Bypass)</button>
    <div id="statusOutput" class="badge" style="display: none;"></div>
    <h3>[Konsol Output API]</h3>
    <div id="jsonOutput" class="output-box">Siap melakukan penarikan otomatis harian...</div>
</div>
<script>
function dapatkanHeader() {
    return {
        "Content-Type": "application/json", "Accept": "application/json", "user-agent": "Dart/3.9 (dart:io)",
        "x-install-id": document.getElementById("installId").value.trim(), "x-device-platform": "android",
        "x-app-installer": "com.android.vending", "x-app-package": "com.digitalnative.atei_bartim",
        "Authorization": "Bearer " + document.getElementById("apiToken").value.trim(),
        "x-device-id": document.getElementById("deviceId").value.trim()
    };
}
async function ambilTokenQR() {
    const url = document.getElementById('apiUrl').value.trim();
    const jsonOutput = document.getElementById('jsonOutput');
    const statusOutput = document.getElementById('statusOutput');
    jsonOutput.innerText = "Mengirim request dengan identitas Flutter...";
    statusOutput.style.display = "none";
    try {
        const response = await fetch(url, { method: 'GET', headers: dapatkanHeader() });
        statusOutput.style.display = "inline-block";
        statusOutput.innerText = `HTTP: ${response.status}`;
        statusOutput.className = response.ok ? "badge success" : "badge error";
        const txt = await response.text();
        try { jsonOutput.innerText = JSON.stringify(JSON.parse(txt), null, 2); } catch(e) { jsonOutput.innerText = txt; }
    } catch (err) {
        statusOutput.style.display = "inline-block";
        statusOutput.className = "badge error";
        statusOutput.innerText = "Koneksi Gagal / CORS";
        jsonOutput.innerText = "Eror: " + err.message + "\n\n💡 TIPS: Buka file ini lewat browser Google Chrome, jangan lewat HTML Viewer bawaan HP.";
    }
}
</script>
</body>
</html>
